<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>アルカン構造シミュレーター</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="アルカン構造">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1048/1048455.png">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f3f4f6; }
        canvas { display: block; touch-action: none; }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="controls">
    <h1 class="text-xl font-bold mb-2">アルカン構造</h1>

    <label class="block mb-1">炭素数</label>
    <select id="carbonSelect" class="border p-2 w-full mb-2">
        <option value="8">C8: オクタン</option>
    </select>

    <label class="block mb-1">異性体を選択（代表例）</label>
    <div id="isomerButtons" class="space-y-1 mb-2"></div>

    <button id="resetViewBtn" class="bg-gray-200 p-2 w-full rounded">
        視点リセット
    </button>
</div>

<script type="module">
import * as THREE from 'three';

let scene, camera, renderer, moleculeGroup;
let currentIsomerIndex = 0;
let scaleFactor = 1;

function createNode(type, children = []) {
    return { type, children };
}

function fillH(node) {
    if (node.type !== 'C') return node;

    const hCount = 4 - node.children.length;
    for (let i = 0; i < hCount; i++) {
        node.children.push(createNode('H'));
    }

    node.children.forEach(fillH);
    return node;
}

const C = (children = []) => createNode('C', children);

const ISOMERS = [];

ISOMERS.push({
    name: "オクタン",
    root: fillH(
        C([C([C([C()])]), C([C([C([C()])])])])
    )
});

ISOMERS.push({
    name: "2,2,4-トリメチルペンタン",
    root: fillH(
        C([
            C([C([C(), C(), C()])]),
            C(),
            C()
        ])
    )
});

ISOMERS.push({
    name: "2-メチルヘプタン",
    root: fillH(
        C([
            C([C([C(), C()])]),
            C([C([C()])])
        ])
    )
});

function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 12);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    moleculeGroup = new THREE.Group();
    scene.add(moleculeGroup);

    setupUI();
    setupInteractions();

    updateMolecule();
    animate();
}

function setupUI() {
    const container = document.getElementById("isomerButtons");

    ISOMERS.forEach((iso, i) => {
        const btn = document.createElement("button");
        btn.className = "bg-blue-500 text-white p-2 w-full rounded";
        btn.textContent = iso.name;

        btn.onclick = () => {
            currentIsomerIndex = i;
            updateMolecule();
        };

        container.appendChild(btn);
    });

    document.getElementById("resetViewBtn").onclick = () => {
        moleculeGroup.rotation.set(0, 0, 0);
        scaleFactor = 1;
        moleculeGroup.scale.set(1,1,1);
    };
}

function build(node, pos) {
    const material = new THREE.MeshBasicMaterial({
        color: node.type === "C" ? 0x333333 : 0x88ccff
    });

    const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(node.type === "C" ? 0.4 : 0.25, 16, 16),
        material
    );

    sphere.position.copy(pos);
    moleculeGroup.add(sphere);

    node.children.forEach((child, i) => {
        const offset = new THREE.Vector3(
            (i - 1) * 1.2,
            -1.2,
            0
        );

        build(child, pos.clone().add(offset));
    });
}

function updateMolecule() {
    while (moleculeGroup.children.length) {
        moleculeGroup.remove(moleculeGroup.children[0]);
    }

    build(ISOMERS[currentIsomerIndex].root, new THREE.Vector3(0,0,0));
}

function setupInteractions() {
    let dragging = false;
    let prevX = 0;
    let prevY = 0;

    renderer.domElement.addEventListener("mousedown", e => {
        dragging = true;
        prevX = e.clientX;
        prevY = e.clientY;
    });

    window.addEventListener("mouseup", () => dragging = false);

    window.addEventListener("mousemove", e => {
        if (!dragging) return;

        moleculeGroup.rotation.y += (e.clientX - prevX) * 0.01;
        moleculeGroup.rotation.x += (e.clientY - prevY) * 0.01;

        prevX = e.clientX;
        prevY = e.clientY;
    });

    let lastDist = 0;

    renderer.domElement.addEventListener("touchmove", e => {
        if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;

            const dist = Math.sqrt(dx*dx + dy*dy);

            if (lastDist) {
                const delta = dist - lastDist;
                scaleFactor += delta * 0.005;
                scaleFactor = Math.max(0.2, Math.min(3, scaleFactor));
                moleculeGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);
            }

            lastDist = dist;
        }
    });

    renderer.domElement.addEventListener("touchend", () => {
        lastDist = 0;
    });
}

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}

window.onload = init;
</script>

</body>
</html>
